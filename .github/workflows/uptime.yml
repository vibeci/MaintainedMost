# The website and the form worker are the only user-facing things with no
# coverage: if either breaks, we would hear about it from a visitor. This
# checks both, and fails loudly.
name: uptime

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: site and form worker
    runs-on: ubuntu-latest
    steps:
      - name: Website answers and looks like itself
        run: |
          body="$(curl -fsS --max-time 20 https://mattermore.dev/)"
          echo "$body" | grep -q 'Mattermost, but more' || {
            echo "the homepage answered but did not contain its own tagline"; exit 1; }

      - name: Hosting form rejects a bad request
        run: |
          # A wrong origin has to be refused. This proves the worker is running
          # and still enforcing, without creating a ticket to do it.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST https://api.mattermore.dev/ \
            -H 'Origin: https://example.invalid' \
            -H 'Content-Type: application/json' \
            -d '{"email":"uptime@example.com","subdomain":"uptime"}')"
          [ "$code" = "403" ] || { echo "expected 403 from a foreign origin, got $code"; exit 1; }

      - name: Signup endpoint validates instead of accepting anything
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST https://api.mattermore.dev/subscribe \
            -H 'Origin: https://mattermore.dev' \
            -H 'Content-Type: application/json' \
            -d '{"email":"not-an-address"}')"
          [ "$code" = "400" ] || { echo "expected 400 for an invalid address, got $code"; exit 1; }

      - name: Container image is pullable without credentials
        run: |
          token="$(curl -fsS 'https://ghcr.io/token?scope=repository:dennisklappe/mattermore:pull&service=ghcr.io' | jq -r .token)"
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            https://ghcr.io/v2/dennisklappe/mattermore/manifests/latest
