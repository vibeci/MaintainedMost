name: MaintainedMost Upstream Check

# Advisory only: patch application is not proof of runtime compatibility.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintainedmost-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, calls, transcriber]
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Fetch and apply the full patch series
        continue-on-error: true
        env:
          COMPONENT: ${{ matrix.component }}
        run: ./scripts/check-upstream.sh "$COMPONENT"
      - name: Create or refresh upstream alert
        if: steps.check.outputs.verification == 'clean' || steps.check.outputs.verification == 'conflict'
        uses: actions/github-script@v7
        env:
          NEW_REF: ${{ steps.check.outputs.new_ref }}
          CURRENT: ${{ steps.check.outputs.current }}
          REPO: ${{ steps.check.outputs.repo }}
          KEY: ${{ steps.check.outputs.key }}
          VERIFICATION: ${{ steps.check.outputs.verification }}
          MIN_SERVER: ${{ steps.check.outputs.min_server }}
          SERVER_TAG: ${{ steps.check.outputs.server_tag }}
          BRANCH: ${{ steps.check.outputs.branch }}
        with:
          script: |
            await require('./scripts/upstream-alert.cjs')({github, context});
      - name: Propagate verification failures
        if: always() && steps.check.outcome == 'failure'
        run: |
          echo 'Upstream verification failed. Network/checkout errors are not patch incompatibility alerts.' >&2
          exit 1
